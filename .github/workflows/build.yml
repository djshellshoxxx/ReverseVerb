name: Build

on:
  push:
    branches: [ master, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libgl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        if: runner.os != 'Linux'
        shell: bash
        env:
          RV_FUZZ_N: 60
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Unit + UI tests (Linux, virtual display)
        if: runner.os == 'Linux'
        env:
          RV_FUZZ_N: 60
          RV_UI_TESTS: 1
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a ctest --test-dir build --output-on-failure

      - name: pluginval (Linux VST3)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Linux.zip
          unzip -oq pluginval.zip && chmod +x pluginval
          sudo apt-get install -y xvfb
          xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process --skip-gui-tests build/ReverseVerb_artefacts/Release/VST3/ReverseVerb.vst3

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          find build -type d -name "ReverseVerb.vst3" -prune -exec cp -r {} dist/ \;
          find build -name "ReverseVerb.clap" -exec cp -r {} dist/ \;
          find build -type f \( -name "ReverseVerb.exe" -o -name "ReverseVerb" \) -path "*Standalone*" -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ReverseVerb-${{ matrix.name }}
          path: dist

  sanitizers:
    name: Tests (ASan + UBSan)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libgl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE="-O1 -g0 -DNDEBUG" -DRV_SANITIZE=ON
      - name: Build tests
        run: cmake --build build --target ReverseVerbTests --parallel 2
      - name: Run tests under sanitizers
        env:
          RV_FUZZ_N: 40
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
