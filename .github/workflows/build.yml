name: Build

on:
  push:
    branches: [ master, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libgl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          find build -type d -name "ReverseVerb.vst3" -prune -exec cp -r {} dist/ \;
          find build -name "ReverseVerb.clap" -exec cp -r {} dist/ \;
          find build -type f \( -name "ReverseVerb.exe" -o -name "ReverseVerb" \) -path "*Standalone*" -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ReverseVerb-${{ matrix.name }}
          path: dist
